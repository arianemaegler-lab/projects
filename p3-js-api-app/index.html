<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BrightSlides</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <!-- NAVBAR -->
  <header class="navbar">
    <h1>✨ BrightSlides</h1>
    <p style="color: #94a3b8; margin: 0; font-size: 14px;">AI-powered presentation generator</p>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h2>
      Turn ideas into <span>beautiful presentations</span>
    </h2>

    <p>
      Generate slides instantly using AI. No design skills needed.
    </p>

    <div class="input-group">
      <input 
        id="topic"
        type="text"
        placeholder="Enter your topic (e.g., Climate Change, Python Basics)"
      />

      <input id="count" type="number" min="1" max="15" value="10" placeholder="Number of slides" />
      
      <!-- Design Template Selector -->
      <select id="template" class="template-select">
        <option value="professional">🎯 Professional Blue</option>
        <option value="creative">✨ Creative Gradient</option>
        <option value="minimal">⚪ Minimal White</option>
        <option value="dark">🌙 Dark Modern</option>
        <option value="vibrant">🌈 Vibrant Colorful</option>
      </select>

      <button onclick="generateSlides()" class="btn-primary">
        Generate Slides
      </button>
    </div>
  </section>

  <!-- MODAL -->
  <div id="output" class="modal hidden">
    <div class="modal-content">
      <h3>🎉 Your Presentation</h3>
      <div id="result"></div>
      <button onclick="closeModal()" class="btn-primary">Close</button>
    </div>
  </div>

</body>
</html>
